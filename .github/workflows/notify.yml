name: Morning schedule notification
on:
  schedule:
    - cron: '5,35 6-8 * * *'
  workflow_dispatch:
    inputs:
      daily:
        description: 'true = behave exactly like the scheduled morning run'
        default: 'false'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install firebase-admin
      - run: node send-morning-notification.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.daily != 'true') && '1' || '' }}
